[project]
name = "rag-minimal-demo"
version = "0.1.0"
description = "最小化 RAG demo - 50 行代码看清 retrieval-augmented generation 全流程"
requires-python = ">=3.10"
dependencies = [
    # 默认 TF-IDF 模式只需要这些 (零下载, 立即可跑)
    "scikit-learn>=1.3",
    "numpy<2",
    "openai>=1.30",
]

# 如果要用 --neural (sentence-transformers) 模式, 装下面 extras:
#   uv sync --extra neural
#
# 适配 torch >= 2.4 的现代环境:
#   - Linux x86_64
#   - macOS arm64 (M1/M2/M3/M4)
#   - Windows
# (不适合 macOS x86_64 / Intel Mac, 那个用 pyproject.pinned.toml)
[project.optional-dependencies]
neural = [
    "sentence-transformers>=3.0",
    "transformers>=4.45",
    "torch>=2.4",
]
